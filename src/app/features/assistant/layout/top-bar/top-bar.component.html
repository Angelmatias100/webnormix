<header class="top-bar">
  <div class="top-bar-left">
    <button app-button (click)="onBack()" variant="ghost" class="back-button">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <polyline points="15 18 9 12 15 6"></polyline>
      </svg>
    </button>
    <div class="divider"></div>
    <div class="logo">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor">
        <circle cx="12" cy="12" r="10"></circle>
      </svg>
    </div>
  </div>

  <div class="top-bar-right">
    <app-chip variant="cyan" size="small" class="status-chip">
      <span class="pulse-dot"></span>
      Sesión segura activa
    </app-chip>

    <span class="case-id">Caso 9942</span>

    <button app-button variant="ghost" size="small" class="icon-button">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path>
      </svg>
    </button>

    <button app-button variant="ghost" size="small" class="icon-button notifications-button">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path>
        <path d="M13.73 21a2 2 0 0 1-3.46 0"></path>
      </svg>
      <span class="notification-dot"></span>
    </button>

    <div class="avatar">JC</div>
  </div>
</header>
