<main class="center-area" [class.drag-over]="isDragOver">

  <!-- Messages / Empty state -->
  <div class="content-area">
    <div class="content-inner">
      <app-empty-state *ngIf="mode === 'empty'" (examplePicked)="onExamplePicked($event)"></app-empty-state>
      <app-message-stream *ngIf="mode === 'analysis'"></app-message-stream>
    </div>
  </div>

  <!-- Input -->
  <div class="input-area">
    <div class="input-wrap">
      <!-- Drop hint -->
      <div class="drop-zone" [class.active]="isDragOver">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/>
        </svg>
        <span class="drop-text">Suelta el archivo aquí</span>
      </div>

      <!-- Row -->
      <div class="input-row">
        <button class="action-btn" (click)="attachFile()" title="Adjuntar archivo">
          <span class="material-symbols-outlined">attach_file</span>
        </button>

        <textarea
          class="message-input"
          placeholder="Describe tu situación o consulta regulatoria..."
          [(ngModel)]="inputValue"
          (keydown)="onKeyDown($event)"
          rows="1"
        ></textarea>

        <button class="send-btn" (click)="sendMessage()" [disabled]="!inputValue.trim()" title="Enviar">
          <span class="material-symbols-outlined">arrow_upward</span>
        </button>
      </div>

      <p class="input-hint">Normix puede cometer errores. Verifica la información importante.</p>
    </div>
  </div>

</main>
