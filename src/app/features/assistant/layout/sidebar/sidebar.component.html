<aside class="sidebar">

  <!-- Logo -->
  <div class="sidebar__logo">
    <div class="sidebar__logo-icon">
      <span class="material-symbols-outlined">shield</span>
    </div>
    <span class="sidebar__logo-name">Normix</span>
  </div>

  <!-- New analysis -->
  <button class="sidebar__new-btn" (click)="selectCategory(activeCategory)">
    <span class="material-symbols-outlined">add</span>
    Nuevo análisis
  </button>

  <!-- Categories -->
  <nav class="sidebar__section">
    <p class="sidebar__section-label">Categorías</p>
    <div class="sidebar__list">
      <button
        *ngFor="let cat of categories"
        class="sidebar__item"
        [class.sidebar__item--active]="activeCategory === cat.id"
        (click)="selectCategory(cat.id)"
      >
        <span class="material-symbols-outlined sidebar__item-icon">{{ cat.icon }}</span>
        <span class="sidebar__item-label">{{ cat.name }}</span>
      </button>
    </div>
  </nav>

  <!-- Recent -->
  <nav class="sidebar__section sidebar__section--grow">
    <p class="sidebar__section-label">Recientes</p>
    <div class="sidebar__list">
      <button
        *ngFor="let a of recentAnalyses"
        class="sidebar__item sidebar__item--recent"
        [class.sidebar__item--active]="a.active"
      >
        <span class="material-symbols-outlined sidebar__item-icon">chat_bubble</span>
        <div class="sidebar__recent-info">
          <span class="sidebar__recent-title">{{ a.title }}</span>
          <span class="sidebar__recent-date">{{ a.date }}</span>
        </div>
        <span *ngIf="a.active" class="sidebar__active-dot"></span>
      </button>
    </div>
  </nav>

  <!-- Footer: back to home -->
  <div class="sidebar__footer">
    <button class="sidebar__back-btn" (click)="goHome()">
      <span class="material-symbols-outlined">arrow_back</span>
      Volver al inicio
    </button>
  </div>

</aside>
