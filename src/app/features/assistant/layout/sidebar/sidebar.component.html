<aside class="sidebar">
  <button class="new-analysis-btn" (click)="newAnalysis()">
    <span class="plus-icon">+</span>
    Nuevo análisis
  </button>

  <div class="navigator-section">
    <h3 class="section-title">Intelligence Navigator</h3>
    <div class="categories">
      <button
        *ngFor="let category of categories"
        [class.active]="activeCategory === category.id"
        (click)="selectCategory(category.id)"
        class="category-button"
      >
        <span class="icon">{{ category.icon }}</span>
        <span class="label">{{ category.name }}</span>
      </button>
    </div>
  </div>

  <div class="recent-section">
    <h3 class="section-title">Análisis Recientes</h3>
    <div class="recent-list">
      <button *ngFor="let analysis of recentAnalyses" class="recent-item" [class.active]="analysis.active">
        <div class="recent-info">
          <div class="recent-title">{{ analysis.title }}</div>
          <div class="recent-date">{{ analysis.date }}</div>
        </div>
        <span *ngIf="analysis.active" class="active-indicator"></span>
      </button>
    </div>
  </div>
</aside>
